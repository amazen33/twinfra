apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinfra-openbao
  namespace: twinfra-platform-services
  labels:
    twinfra.io/environment: dev
    twinfra.io/region: cairo-1
    twinfra.io/component: openbao
    app.kubernetes.io/part-of: twinfra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twinfra-openbao
  template:
    metadata:
      labels:
        twinfra.io/environment: dev
        twinfra.io/region: cairo-1
        twinfra.io/component: openbao
        app.kubernetes.io/part-of: twinfra
        app.kubernetes.io/name: twinfra-openbao
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openbao
        image: registry.twinfra.example.com/docker.io/openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        volumeMounts: &id001
        - name: auth
          mountPath: /auth
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: pg-ca
          mountPath: /pg-ca
          readOnly: true
        - name: code
          mountPath: /code
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        command:
        - bao
        - server
        - -config=/runtime/openbao.hcl
        readinessProbe:
          httpGet:
            path: /v1/sys/init
            port: 8200
            scheme: HTTPS
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      initContainers:
      - name: config
        image: registry.twinfra.example.com/docker.io/library/python:3.14.1-slim-trixie@sha256:b823ded4377ebb5ff1af5926702df2284e53cecbc6e3549e93a19d8632a1897e
        command:
        - python
        - /code/runtime-config.py
        - openbao
        volumeMounts: *id001
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      volumes:
      - name: auth
        secret:
          secretName: twinfra-openbao-db
          defaultMode: 288
      - name: tls
        secret:
          secretName: twinfra-openbao-tls
          defaultMode: 288
      - name: pg-ca
        secret:
          secretName: twinfra-postgres-ca
          defaultMode: 288
      - name: code
        configMap:
          name: twinfra-runtime-config
      - name: runtime
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: twinfra-openbao
---
