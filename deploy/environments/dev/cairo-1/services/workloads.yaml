apiVersion: v1
kind: ConfigMap
metadata:
  name: twinfra-runtime-config
  namespace: twinfra-platform-services
  labels:
    twinfra.io/environment: dev
    twinfra.io/region: cairo-1
    twinfra.io/component: runtime-config
    app.kubernetes.io/part-of: twinfra
data:
  runtime-config.py: "\"\"\"Run inside a restricted init container; private config\
    \ stays on tmpfs.\"\"\"\nimport json\nfrom pathlib import Path\nimport sys\nfrom\
    \ urllib.parse import quote\n\nimport os\n\n\ndef configure(mode, root=Path('/')):\n\
    \    def p(value):\n        return root / value.lstrip('/')\n    password=p('/auth/password').read_text().strip()\n\
    \    if not password or any(c in password for c in '\\r\\n'):raise ValueError('Invalid\
    \ credential format')\n    host=os.environ.get('POSTGRES_HOST','twinfra-postgres-rw.twinfra-platform-services.svc.cluster.local')\n\
    \    if mode=='openbao':\n        url=f'postgresql://openbao:{quote(password,safe=\"\
    \")}@{host}:5432/openbao?sslmode=verify-full&sslrootcert=/pg-ca/ca.crt'\n    \
    \    text=('ui = true\\ndisable_mlock = true\\napi_addr = \"https://twinfra-openbao.twinfra-platform-services.svc.cluster.local:8200\"\
    \\n'\n              'storage \"postgresql\" {\\n connection_url = '+json.dumps(url)+'\\\
    n max_parallel = \"4\"\\n}\\n'\n              'listener \"tcp\" {\\n address =\
    \ \"0.0.0.0:8200\"\\n cluster_address = \"127.0.0.1:8202\"\\n tls_cert_file =\
    \ \"/tls/tls.crt\"\\n tls_key_file = \"/tls/tls.key\"\\n}\\n'\n              '#\
    \ This listener is reachable only inside the Pod network namespace.\\n'\n    \
    \          '# kubectl port-forward binds the operator endpoint to host loopback.\\\
    n'\n              'listener \"tcp\" {\\n address = \"127.0.0.1:8201\"\\n cluster_address\
    \ = \"127.0.0.1:8203\"\\n tls_disable = true\\n}\\n')\n        target=p('/runtime/openbao.hcl')\n\
    \    elif mode=='keycloak':\n        # The PostgreSQL JDBC driver verifies the\
    \ CNPG public CA and service name.\n        url=f'jdbc:postgresql://{host}:5432/keycloak?sslmode=verify-full&sslrootcert=/pg-ca/ca.crt'\n\
    \        text=('db=postgres\\ndb-username=keycloak\\ndb-password='+password+'\\\
    ndb-url='+url+'\\n'\n              'http-enabled=false\\nhttps-certificate-file=/tls/tls.crt\\\
    nhttps-certificate-key-file=/tls/tls.key\\n'\n              # Keep the browser\
    \ issuer stable; allow TLS-verified Service backchannels.\n              'hostname='+os.environ.get('KEYCLOAK_ORIGIN','https://auth.dev.cairo-1.twinfra.example.com:18443')+'\\\
    nhostname-backchannel-dynamic=true\\nhealth-enabled=true\\nmetrics-enabled=true\\\
    ncache=local\\n')\n        text += 'bootstrap-admin-username='+p('/admin/username').read_text().strip()+'\\\
    nbootstrap-admin-password='+p('/admin/password').read_text().strip()+'\\n'\n \
    \       realm=json.loads(p('/realm-source/twinfra-realm.json').read_text())\n\
    \        realm['clients'][0]['secret']=p('/oidc/client_secret').read_text().strip()\n\
    \        import_dir=p('/import');import_dir.mkdir(exist_ok=True)\n        imported=import_dir/'twinfra-realm.json';imported.write_text(json.dumps(realm));imported.chmod(0o600)\n\
    \        target=p('/runtime/keycloak.conf')\n    else:raise ValueError('Unknown\
    \ runtime')\n    target.write_text(text);target.chmod(0o600)\n\n\nif __name__\
    \ == '__main__':\n    configure(sys.argv[1])\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: twinfra-keycloak-realm
  namespace: twinfra-platform-services
  labels:
    twinfra.io/environment: dev
    twinfra.io/region: cairo-1
    twinfra.io/component: keycloak-realm
    app.kubernetes.io/part-of: twinfra
data:
  twinfra-realm.json: "{\n  \"realm\": \"twinfra\",\n  \"displayName\": \"Twinfra\"\
    ,\n  \"enabled\": true,\n  \"sslRequired\": \"all\",\n  \"registrationAllowed\"\
    : false,\n  \"bruteForceProtected\": true,\n  \"accessTokenLifespan\": 300,\n\
    \  \"defaultSignatureAlgorithm\": \"RS256\",\n  \"users\": [],\n  \"clients\"\
    : [\n    {\n      \"clientId\": \"twinfra-console\",\n      \"name\": \"Twinfra\
    \ control plane\",\n      \"enabled\": true,\n      \"protocol\": \"openid-connect\"\
    ,\n      \"publicClient\": false,\n      \"standardFlowEnabled\": true,\n    \
    \  \"implicitFlowEnabled\": false,\n      \"directAccessGrantsEnabled\": false,\n\
    \      \"serviceAccountsEnabled\": false,\n      \"fullScopeAllowed\": false,\n\
    \      \"redirectUris\": [\n        \"https://console.dev.cairo-1.twinfra.example.com:18444/console/callback\"\
    \n      ],\n      \"webOrigins\": [\n        \"https://console.dev.cairo-1.twinfra.example.com:18444\"\
    \n      ],\n      \"attributes\": {\n        \"pkce.code.challenge.method\": \"\
    S256\",\n        \"post.logout.redirect.uris\": \"https://console.dev.cairo-1.twinfra.example.com:18444/console/\"\
    \n      },\n      \"protocolMappers\": [\n        {\n          \"name\": \"console-audience\"\
    ,\n          \"protocol\": \"openid-connect\",\n          \"protocolMapper\":\
    \ \"oidc-audience-mapper\",\n          \"config\": {\n            \"included.client.audience\"\
    : \"twinfra-console\",\n            \"id.token.claim\": \"true\",\n          \
    \  \"access.token.claim\": \"true\"\n          }\n        },\n        {\n    \
    \      \"name\": \"console-roles\",\n          \"protocol\": \"openid-connect\"\
    ,\n          \"protocolMapper\": \"oidc-usermodel-client-role-mapper\",\n    \
    \      \"config\": {\n            \"usermodel.clientRoleMapping.clientId\": \"\
    twinfra-console\",\n            \"claim.name\": \"resource_access.twinfra-console.roles\"\
    ,\n            \"jsonType.label\": \"String\",\n            \"multivalued\": \"\
    true\",\n            \"id.token.claim\": \"true\",\n            \"access.token.claim\"\
    : \"true\"\n          }\n        },\n        {\n          \"name\": \"console-username\"\
    ,\n          \"protocol\": \"openid-connect\",\n          \"protocolMapper\":\
    \ \"oidc-usermodel-property-mapper\",\n          \"config\": {\n            \"\
    user.attribute\": \"username\",\n            \"claim.name\": \"preferred_username\"\
    ,\n            \"jsonType.label\": \"String\",\n            \"id.token.claim\"\
    : \"true\",\n            \"access.token.claim\": \"true\"\n          }\n     \
    \   }\n      ]\n    }\n  ],\n  \"roles\": {\n    \"client\": {\n      \"twinfra-console\"\
    : [\n        {\n          \"name\": \"console.viewer\"\n        },\n        {\n\
    \          \"name\": \"console.admin\"\n        }\n      ]\n    }\n  },\n  \"\
    requiredActions\": [\n    {\n      \"alias\": \"CONFIGURE_TOTP\",\n      \"name\"\
    : \"Configure OTP\",\n      \"providerId\": \"CONFIGURE_TOTP\",\n      \"enabled\"\
    : true,\n      \"defaultAction\": true,\n      \"priority\": 10\n    }\n  ],\n\
    \  \"otpPolicyType\": \"totp\",\n  \"otpPolicyAlgorithm\": \"HmacSHA1\",\n  \"\
    otpPolicyDigits\": 6,\n  \"otpPolicyPeriod\": 30,\n  \"otpPolicyLookAheadWindow\"\
    : 1\n}\n"
---
