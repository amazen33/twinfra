apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcloud-console
  namespace: platform-services
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vcloud-console-reader
  namespace: platform-services
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vcloud-console-reader
  namespace: platform-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vcloud-console-reader
subjects:
- kind: ServiceAccount
  name: vcloud-console
  namespace: platform-services
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-portal
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: vcloud-console
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: apisix
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: ministack
    toPorts:
    - ports:
      - port: '4566'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: keycloak
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '16443'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-portal-emulators
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: ministack
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: vcloud-console
    toPorts:
    - ports:
      - port: '4566'
        protocol: TCP
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-portal-gateway
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: apisix
  ingress: []
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: vcloud-console
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: keycloak
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-portal-keycloak
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: keycloak
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: apisix
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: vcloud-console
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
  egress: []
