apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: vcloud-portal-shell
  namespace: platform-services
spec:
  ingressClassName: vcloud-local
  http:
  - name: shell
    priority: 100
    match:
      hosts:
      - localhost
      paths:
      - /console
      - /console/*
    backends:
    - serviceName: vcloud-console
      servicePort: 3000
      resolveGranularity: service
    websocket: false
    plugins:
    - name: serverless-pre-function
      enable: true
      config:
        phase: rewrite
        _meta:
          priority: 10000
        functions:
        - return function(conf, ctx) for _,name in ipairs({'X-ID-Token','X-Access-Token','X-Userinfo','X-Refresh-Token','X-Raw-ID-Token'})
          do ngx.req.clear_header(name) end end
    - name: openid-connect
      enable: true
      secretRef: vcloud-console-oidc
      config:
        client_id: vcloud-console
        discovery: https://keycloak.platform-services.svc.cluster.local/realms/vcloud/.well-known/openid-configuration
        bearer_only: false
        unauth_action: auth
        ssl_verify: true
        use_pkce: true
        scope: openid
        timeout: 5
        redirect_uri: http://localhost:18080/console/callback
        logout_path: /console/logout
        session:
          cookie_name: vcloud_portal
          cookie_path: /console
          cookie_secure: false
          cookie_http_only: true
          cookie_same_site: Lax
          idling_timeout: 900
          absolute_timeout: 3600
        set_id_token_header: true
        set_access_token_header: false
        set_refresh_token_header: false
        set_userinfo_header: false
        accept_none_alg: false
        accept_unsupported_alg: false
        token_signing_alg_values_expected: RS256
        claim_validator:
          issuer:
            valid_issuers:
            - https://localhost:18443/realms/vcloud
          audience:
            required: true
            match_with_client_id: true
        claim_schema:
          type: object
          required:
          - id_token
          properties:
            id_token:
              type: object
              required:
              - resource_access
              properties:
                resource_access:
                  type: object
                  required:
                  - vcloud-console
                  properties:
                    vcloud-console:
                      type: object
                      required:
                      - roles
                      properties:
                        roles:
                          type: array
                          contains:
                            enum:
                            - console.viewer
                            - console.admin
    - name: proxy-rewrite
      enable: true
      config:
        headers:
          set:
            X-Forwarded-Host: localhost:18080
            X-Forwarded-Proto: http
          remove:
          - Authorization
          - Cookie
          - X-Access-Token
          - X-Userinfo
          - X-Refresh-Token
          - X-Raw-ID-Token
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            Cache-Control: no-store
            Referrer-Policy: same-origin
    - name: prometheus
      enable: true
---
