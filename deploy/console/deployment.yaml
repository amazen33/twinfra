apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcloud-console
  namespace: platform-services
  labels:
    app.kubernetes.io/part-of: vcloud-console
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: vcloud-console
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: console
        image: registry.vcloud.example.com/vcloud/vcloud-console@sha256:47f58759321fafa57e95312fa58c42bf7473045be47a27e86c290cf7662a8c50
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: api-identity
          mountPath: /var/run/secrets/vcloud
          readOnly: true
        - name: oidc-trust
          mountPath: /oidc-trust
          readOnly: true
        readinessProbe: &id002
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz',timeout=2)
          timeoutSeconds: 3
        livenessProbe: *id002
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: api-identity
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      - name: oidc-trust
        secret:
          secretName: vcloud-wsl-keycloak-tls
          items:
          - key: tls.crt
            path: tls.crt
          defaultMode: 288
      serviceAccountName: vcloud-console
