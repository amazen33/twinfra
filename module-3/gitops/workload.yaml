{
  "apiVersion": "serving.knative.dev/v1",
  "kind": "Service",
  "metadata": {
    "name": "vcloud-api",
    "labels": {
      "app.kubernetes.io/part-of": "vcloud"
    },
    "namespace": "workload-apps",
    "annotations": {
      "vcloud.io/source-revision": "bootstrap"
    }
  },
  "spec": {
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "vcloud-api"
        },
        "annotations": {
          "autoscaling.knative.dev/min-scale": "0",
          "autoscaling.knative.dev/max-scale": "4"
        }
      },
      "spec": {
        "serviceAccountName": "vcloud-api",
        "automountServiceAccountToken": false,
        "containerConcurrency": 20,
        "timeoutSeconds": 60,
        "containers": [
          {
            "name": "api",
            "image": "registry.vcloud.example.com/vcloud/api:0.1.0",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "256Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              }
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              }
            }
          }
        ]
      }
    }
  }
}
