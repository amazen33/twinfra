apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vcloud-argocd
  labels:
    app.kubernetes.io/part-of: vcloud
  namespace: platform-services
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  namespaceSelector:
    matchNames:
    - platform-services
  endpoints:
  - port: metrics
    interval: 30s
