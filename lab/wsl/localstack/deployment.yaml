apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack-aws-console
  namespace: platform-services
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: localstack-aws-console
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: localstack
        image: registry.vcloud.example.com/docker.io/localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
        - name: SERVICES
          value: s3,ec2,iam,dynamodb
        - name: EAGER_SERVICE_LOADING
          value: '1'
        - name: STRICT_SERVICE_LOADING
          value: '1'
        - name: GATEWAY_LISTEN
          value: 0.0.0.0:4566
        - name: LOCALSTACK_HOST
          value: aws.platform.example.com:18080
        - name: DNS_ADDRESS
          value: '0'
        - name: SKIP_SSL_CERT_DOWNLOAD
          value: '1'
        - name: SKIP_INFRA_DOWNLOADS
          value: '1'
        - name: DISABLE_EVENTS
          value: '1'
        - name: DEBUG
          value: '0'
        - name: PERSISTENCE
          value: '0'
        - name: DYNAMODB_IN_MEMORY
          value: '1'
        - name: DYNAMODB_HEAP_SIZE
          value: 256m
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /home/localstack
        - name: XDG_CACHE_HOME
          value: /home/localstack/.cache
        ports:
        - name: aws
          containerPort: 4566
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          exec:
            command:
            - python
            - -c
            - import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3));
              assert all(h['services'].get(s)=='running' for s in ('s3','ec2','iam','dynamodb'))
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3));
              assert all(h['services'].get(s)=='running' for s in ('s3','ec2','iam','dynamodb'))
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3)
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /var/lib/localstack
        - name: home
          mountPath: /home/localstack
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: state
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: home
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
