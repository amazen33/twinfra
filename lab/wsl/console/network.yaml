apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-console-vcloud-console-shell
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: vcloud-console-shell
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: apisix
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcloud-console-storage-ui
  namespace: platform-services
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: storage-ui
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: apisix
    toPorts:
    - ports:
      - port: '9001'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: platform-services
        k8s:app.kubernetes.io/name: ministack
    toPorts:
    - ports:
      - port: '4566'
        protocol: TCP
---
apiVersion: cilium.io/v2
