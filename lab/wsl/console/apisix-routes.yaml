apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: vcloud-console-shell
  namespace: platform-services
spec:
  ingressClassName: vcloud-local
  http:
  - name: shell
    priority: 5
    match:
      hosts:
      - console.vcloud.local
      paths:
      - /*
    backends:
    - serviceName: vcloud-console-shell
      servicePort: 3000
      resolveGranularity: service
    websocket: false
    plugins:
    - name: serverless-pre-function
      enable: true
      config:
        phase: rewrite
        functions:
        - return function(conf, ctx) ngx.req.clear_header('X-Access-Token'); ngx.req.clear_header('X-ID-Token');
          ngx.req.clear_header('X-Userinfo'); ngx.req.clear_header('X-Refresh-Token');
          ngx.req.clear_header('X-Raw-ID-Token') end
        _meta:
          priority: 10000
    - name: openid-connect
      enable: true
      secretRef: vcloud-console-oidc
      config:
        client_id: vcloud-console
        discovery: https://auth.vcloud.example.com/realms/vcloud/.well-known/openid-configuration
        bearer_only: false
        unauth_action: auth
        ssl_verify: true
        use_pkce: true
        scope: openid
        redirect_uri: http://console.vcloud.local:18080/oidc/callback
        logout_path: /oidc/logout
        session:
          cookie_name: vcloud_console
          cookie_path: /
          cookie_secure: false
          cookie_http_only: true
          cookie_same_site: Lax
          idling_timeout: 900
          absolute_timeout: 3600
        set_access_token_header: true
        access_token_in_authorization_header: false
        set_id_token_header: true
        set_userinfo_header: false
        set_refresh_token_header: false
        accept_none_alg: false
        accept_unsupported_alg: false
        token_signing_alg_values_expected: RS256
        claim_validator:
          issuer:
            valid_issuers:
            - https://auth.vcloud.example.com/realms/vcloud
          audience:
            required: true
            match_with_client_id: true
    - name: proxy-rewrite
      enable: true
      config:
        headers:
          set:
            X-Forwarded-Host: console.vcloud.local:18080
            X-Forwarded-Proto: http
    - name: cors
      enable: true
      config:
        allow_origins: http://console.vcloud.local:18080
        allow_credential: true
        allow_methods: GET,POST,PUT,DELETE,HEAD,OPTIONS
        allow_headers: Authorization,Content-Type,X-Amz-Date,X-Amz-Target,X-Amz-Security-Token,X-Amz-Content-Sha256
        expose_headers: ETag
        max_age: 300
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Frame-Options: SAMEORIGIN
            Access-Control-Allow-Origin: http://console.vcloud.local:18080
            Access-Control-Allow-Credentials: 'true'
            X-Content-Type-Options: nosniff
    - name: prometheus
      enable: true
---
