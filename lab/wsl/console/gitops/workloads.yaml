apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: platform-services
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: ministack
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ministack
        image: registry.vcloud.example.com/docker.io/ministackorg/ministack@sha256:0e51461e29524b884306810ce05c8a2e47f90f0c4dddc5a5f52166d2b56c7818
        ports:
        - name: http
          containerPort: 4566
        env:
        - name: GATEWAY_PORT
          value: '4566'
        - name: S3_PERSIST
          value: '0'
        - name: MINISTACK_PERSIST
          value: '0'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        - name: USE_SSL
          value: '0'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health',timeout=2)
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health',timeout=2)
          timeoutSeconds: 3
          failureThreshold: 30
          periodSeconds: 5
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
