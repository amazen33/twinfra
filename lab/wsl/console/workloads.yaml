apiVersion: v1
kind: ConfigMap
metadata:
  name: vcloud-console-code
  namespace: platform-services
data:
  ui.py: "#!/usr/bin/env python3\n# SPDX-License-Identifier: MIT\n\"\"\"Small read-only\
    \ console views. No arbitrary endpoints, writes or real AWS keys.\"\"\"\nimport\
    \ hashlib\nimport hmac\nfrom html import escape\nfrom http.server import BaseHTTPRequestHandler,\
    \ ThreadingHTTPServer\nimport json\nimport os\nfrom pathlib import Path\nfrom\
    \ urllib.parse import parse_qs, quote, urlencode, urlsplit\nimport urllib.request\n\
    import xml.etree.ElementTree as ET\nfrom datetime import datetime, timezone\n\n\
    ENDPOINTS = {\n    'ministack': os.environ.get('MINISTACK_ENDPOINT','http://ministack.platform-services.svc.cluster.local:4566'),\n\
    }\nMAX_RESPONSE = 1024 * 1024\n\n\ndef signed_request(backend, service, method='GET',\
    \ path='/', query=None, payload=b'', target=None, now=None):\n    \"\"\"SigV4\
    \ is computed AFTER selecting the direct, fixed in-cluster endpoint.\n\n    These\
    \ literal test/test emulator credentials are public fixtures, never real\n   \
    \ AWS credentials. Container egress policy admits only the MiniStack Pod endpoint.\n\
    \    \"\"\"\n    endpoint = ENDPOINTS[backend]  # no user-provided URL / SSRF\n\
    \    host = urlsplit(endpoint).netloc\n    path = '/' + quote(path.lstrip('/'),\
    \ safe='/~')\n    pairs = sorted((str(k), str(v)) for k, v in (query or {}).items())\n\
    \    qs = '&'.join(quote(k, safe='~') + '=' + quote(v, safe='~') for k, v in pairs)\n\
    \    now = now or datetime.now(timezone.utc)\n    date, stamp = now.strftime('%Y%m%d'),\
    \ now.strftime('%Y%m%dT%H%M%SZ')\n    digest = hashlib.sha256(payload).hexdigest()\n\
    \    headers = {'host': host, 'x-amz-date': stamp, 'x-amz-content-sha256': digest}\n\
    \    if target:\n        headers.update({'content-type': 'application/x-amz-json-1.0',\
    \ 'x-amz-target': target})\n    keys = sorted(headers)\n    canonical = '\\n'.join([method,\
    \ path, qs, ''.join(k + ':' + headers[k] + '\\n' for k in keys),\n           \
    \                ';'.join(keys), digest])\n    scope = f'{date}/us-east-1/{service}/aws4_request'\n\
    \    message = 'AWS4-HMAC-SHA256\\n' + stamp + '\\n' + scope + '\\n' + hashlib.sha256(canonical.encode()).hexdigest()\n\
    \    key = b'AWS4test'\n    for part in (date, 'us-east-1', service, 'aws4_request'):\n\
    \        key = hmac.new(key, part.encode(), hashlib.sha256).digest()\n    signature\
    \ = hmac.new(key, message.encode(), hashlib.sha256).hexdigest()\n    headers['Authorization']\
    \ = f'AWS4-HMAC-SHA256 Credential=test/{scope}, SignedHeaders={\";\".join(keys)},\
    \ Signature={signature}'\n    return urllib.request.Request(endpoint + path +\
    \ ('?' + qs if qs else ''), data=payload if method == 'POST' else None,\n    \
    \                              headers=headers, method=method)\n\n\ndef read(request):\n\
    \    # Refuse redirects to other endpoints and bound memory/latency.\n    class\
    \ NoRedirect(urllib.request.HTTPRedirectHandler):\n        def redirect_request(self,\
    \ req, fp, code, msg, headers, newurl):\n            return None\n    with urllib.request.build_opener(NoRedirect).open(request,\
    \ timeout=4) as response:\n        raw = response.read(MAX_RESPONSE + 1)\n   \
    \ if len(raw) > MAX_RESPONSE:\n        raise ValueError('Response exceeds bounded\
    \ preview')\n    return raw\n\n\ndef xml_values(raw, tag):\n    if b'<!DOCTYPE'\
    \ in raw.upper() or b'<!ENTITY' in raw.upper():\n        raise ValueError('XML\
    \ entities forbidden')\n    return [el.text or '' for el in ET.fromstring(raw).iter()\
    \ if el.tag.rsplit('}', 1)[-1] == tag]\n\n\ndef browser(view, backend, selection='',\
    \ mount=''):\n    if backend not in ENDPOINTS or view not in ('storage', 'dynamodb'):\n\
    \        raise ValueError('Unsupported browser/backend')\n    base = (mount or\
    \ '/' + view) + '/?backend=' + backend\n    if view == 'storage':\n        if\
    \ selection:\n            raw = read(signed_request(backend, 's3', path='/' +\
    \ selection,\n                                     query={'list-type': '2', 'max-keys':\
    \ '100'}))\n            items = xml_values(raw, 'Key')\n            body = '<p>First\
    \ 100 object keys in ' + escape(selection) + '</p><ul>' + ''.join('<li>' + escape(x)\
    \ + '</li>' for x in items) + '</ul>'\n        else:\n            items = xml_values(read(signed_request(backend,\
    \ 's3')), 'Name')\n            body = '<ul>' + ''.join('<li><a href=\"' + base\
    \ + '&bucket=' + quote(x, safe='') + '\">' + escape(x) + '</a></li>' for x in\
    \ items) + '</ul>'\n    else:\n        operation = 'DescribeTable' if selection\
    \ else 'ListTables'\n        payload = json.dumps({'TableName': selection} if\
    \ selection else {'Limit': 100}).encode()\n        result = json.loads(read(signed_request(backend,\
    \ 'dynamodb', 'POST', payload=payload,\n                                     \
    \        target='DynamoDB_20120810.' + operation)))\n        if selection:\n \
    \           # Table metadata only: no scan that could disclose tenant row contents.\n\
    \            body = '<pre>' + escape(json.dumps(result, indent=2)) + '</pre>'\n\
    \        else:\n            body = '<ul>' + ''.join('<li><a href=\"' + base +\
    \ '&table=' + quote(x, safe='') + '\">' + escape(x) + '</a></li>' for x in result.get('TableNames',\
    \ [])) + '</ul>'\n    if (view == 'storage' and not items) or (view == 'dynamodb'\
    \ and not result):\n        body += '<p>No resources found.</p>'\n    return '<p><a\
    \ href=\"' + base + '\">Refresh</a></p>' + body\n\n\ndef page(title, body, mount=''):\n\
    \    return ('<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"\
    viewport\" content=\"width=device-width,initial-scale=1\">'\n            '<title>'\
    \ + escape(title) + ' \xB7 Twinfra</title><link rel=\"stylesheet\" href=\"' +\
    \ escape(mount) + '/console.css\">'\n            '<body><header><a href=\"' +\
    \ ('/console/overview' if mount else '/') + '\">Twinfra console</a></header><main><h1>'\
    \ + escape(title) + '</h1>' + body + '</main></body></html>').encode()\n\n\ndef\
    \ navigation(profile):\n    cards = []\n    for item in profile['backends']:\n\
    \        name = item['name']\n        href = '/' + name + '/'\n        if name\
    \ == 'ministack':\n            href += '_' + name + '/health'\n        action\
    \ = '<a href=\"' + href + '\">Open ' + escape(name) + '</a>' if item['enabled']\
    \ else '<span>Disabled reference</span>'\n        cards.append('<article><h2>'\
    \ + escape(name) + '</h2><p>' + escape(item['description']) + '</p><p>' + escape(item['license'])\
    \ + '</p>' + action + '</article>')\n    return page('Platform services', '<p>Read-only\
    \ development navigation. Backend availability is checked when opened.</p>' +\
    \ ''.join(cards))\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def log_message(self,\
    \ *args):\n        pass  # never log cookies, OIDC codes, credentials or user\
    \ query values\n\n    def respond(self, status, body, content='text/html; charset=utf-8'):\n\
    \        self.send_response(status)\n        self.send_header('Content-Type',\
    \ content)\n        self.send_header('Content-Length', str(len(body)))\n     \
    \   self.send_header('Cache-Control', 'no-store')\n        self.send_header('X-Frame-Options',\
    \ 'SAMEORIGIN')\n        self.send_header('Content-Security-Policy', \"default-src\
    \ 'none'; style-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action\
    \ 'self'\")\n        self.send_header('X-Content-Type-Options', 'nosniff')\n \
    \       self.end_headers()\n        self.wfile.write(body)\n\n    def do_GET(self):\n\
    \        url = urlsplit(self.path)\n        if url.path == '/healthz':\n     \
    \       self.respond(200, b'{\"status\":\"running\"}', 'application/json')\n \
    \           return\n        if url.path == '/console.css':\n            self.respond(200,\
    \ b'body{font:16px system-ui;background:#101d2d;color:#edf5ff;margin:0}header,main{padding:24px;max-width:1100px;margin:auto}a{color:#91d3ff}article{display:inline-block;vertical-align:top;width:280px;border:1px\
    \ solid #526780;border-radius:12px;padding:20px;margin:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}span{color:#c8b88d}',\
    \ 'text/css')\n            return\n        if url.path != '/':\n            self.respond(404,\
    \ page('Not found', '<p>This path is not available.</p>'))\n            return\n\
    \        view = os.environ.get('VCLOUD_VIEW', 'shell')\n        if view == 'shell':\n\
    \            self.respond(200, navigation(json.loads(Path('/app/profile.json').read_text(encoding='utf-8'))))\n\
    \            return\n        try:\n            # Only fixed gateway-owned mount\
    \ prefixes can affect generated links.\n            mount = self.headers.get('X-Forwarded-Prefix',\
    \ '')\n            if mount not in ('', '/console/proxy/storage', '/console/proxy/dynamodb'):\n\
    \                mount = ''\n            query = parse_qs(url.query, max_num_fields=5)\n\
    \            backend = query.get('backend', ['ministack'])[0]\n            selection\
    \ = query.get('bucket' if view == 'storage' else 'table', [''])[0]\n         \
    \   if len(selection) > 255 or '/' in selection or '..' in selection:\n      \
    \          raise ValueError('Invalid selection')\n            base = mount or\
    \ '/' + view\n            choose = '<p>MiniStack \xB7 Read-only</p>'\n       \
    \     self.respond(200, page(view.title(), choose + browser(view, backend, selection,\
    \ mount), mount))\n        except (ValueError, KeyError):\n            self.respond(400,\
    \ page('Invalid request', '<p>Choose a configured emulator and resource.</p>'))\n\
    \        except Exception:\n            self.respond(503, page('Backend unavailable',\
    \ '<p>The selected emulator did not return a valid bounded response.</p>'))\n\n\
    \nif __name__ == '__main__':\n    ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT',\
    \ '3000'))), Handler).serve_forever()\n"
  profile.json: "{\n  \"name\": \"vcloud-wsl-local\",\n  \"host\": \"console.vcloud.local\"\
    ,\n  \"origin\": \"http://console.vcloud.local:18080\",\n  \"oidc\": {\n    \"\
    client_id\": \"vcloud-console\",\n    \"secret\": \"vcloud-console-oidc\",\n \
    \   \"issuer\": \"https://auth.vcloud.example.com/realms/vcloud\"\n  },\n  \"\
    backends\": [\n    {\n      \"name\": \"spinifex\",\n      \"namespace\": \"platform-system\"\
    ,\n      \"service\": \"spinifex-console\",\n      \"port\": 3000,\n      \"enabled\"\
    : false,\n      \"websocket\": true,\n      \"license\": \"AGPL-3.0\",\n     \
    \ \"description\": \"Reference only: console not deployed; HPC offloading disabled.\"\
    \n    },\n    {\n      \"name\": \"ministack\",\n      \"namespace\": \"platform-services\"\
    ,\n      \"service\": \"ministack\",\n      \"port\": 4566,\n      \"enabled\"\
    : true,\n      \"websocket\": false,\n      \"license\": \"MIT\",\n      \"description\"\
    : \"AWS API emulator; this endpoint returns API responses, not a web console.\"\
    \n    },\n    {\n      \"name\": \"storage\",\n      \"namespace\": \"platform-services\"\
    ,\n      \"service\": \"storage-ui\",\n      \"port\": 9001,\n      \"enabled\"\
    : true,\n      \"websocket\": false,\n      \"license\": \"MIT\",\n      \"description\"\
    : \"Twinfra read-only S3 browser backed by MiniStack.\"\n    },\n    {\n     \
    \ \"name\": \"dynamodb\",\n      \"namespace\": \"platform-services\",\n     \
    \ \"service\": \"dynamodb-admin\",\n      \"port\": 8081,\n      \"enabled\":\
    \ true,\n      \"websocket\": true,\n      \"license\": \"MIT\",\n      \"description\"\
    : \"Twinfra read-only DynamoDB table viewer; no mutation controls.\"\n    },\n\
    \    {\n      \"name\": \"vault\",\n      \"namespace\": \"platform-system\",\n\
    \      \"service\": \"openbao-ui\",\n      \"port\": 8200,\n      \"enabled\"\
    : false,\n      \"websocket\": true,\n      \"license\": \"MPL-2.0\",\n      \"\
    description\": \"Reference only: local OpenBao is sealed in platform-services;\
    \ native /ui and /v1 paths need a separate verified integration.\"\n    }\n  ]\n\
    }\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcloud-console-shell
  namespace: platform-services
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: vcloud-console-shell
  template:
    metadata:
      labels: *id001
      annotations:
        vcloud.io/config-hash: dea73c568cac8f222fd887b99e08afad18f1c5304146db5395c7df0030f31de7
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: registry.vcloud.example.com/docker.io/library/python:3.14.1-slim-trixie@sha256:b823ded4377ebb5ff1af5926702df2284e53cecbc6e3549e93a19d8632a1897e
        command:
        - python
        - -B
        - /app/ui.py
        env:
        - name: PORT
          value: '3000'
        - name: VCLOUD_VIEW
          value: shell
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/healthz',timeout=2)
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/healthz',timeout=2)
          timeoutSeconds: 3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: code
        configMap:
          name: vcloud-console-code
---
apiVersion: v1
kind: Service
metadata:
  name: vcloud-console-shell
  namespace: platform-services
spec:
  selector:
    app.kubernetes.io/name: vcloud-console-shell
  ports:
  - name: http
    port: 3000
    targetPort: 3000
