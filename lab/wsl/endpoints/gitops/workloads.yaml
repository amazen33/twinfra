            cpu: '2'
            memory: 1536Mi
        startupProbe:
          exec:
            command:
            - python
            - -c
            - import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3));
              assert all(h['services'].get(s)=='running' for s in ('s3','ec2','iam','dynamodb'))
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3));
              assert all(h['services'].get(s)=='running' for s in ('s3','ec2','iam','dynamodb'))
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health',timeout=3)
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /var/lib/localstack
        - name: home
          mountPath: /home/localstack
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: state
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: home
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
