apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: twinfra-perses
  namespace: platform-services
  labels:
    app.kubernetes.io/part-of: twinfra
    twinfra.io/environment: dev
    twinfra.io/region: cairo-1
    twinfra.io/component: perses
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  replicas: 1
  image: registry.vcloud.example.com/quay.io/persesdev/perses@sha256:a0e34ddaf9d7599d96036611af205b948c1179646844202d869f3bcf3d5d9e9c
  metadata:
    labels:
      app.kubernetes.io/name: twinfra-perses
    annotations:
      twinfra.io/provisioning-hash: e924e2ec7c40de3135cff0a3f5826b869634026cf00e8c7ad4c2fbb504ef4247
  serviceAccountName: twinfra-perses
  containerPort: 8080
  storage:
    emptyDir:
      sizeLimit: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    api_prefix: /console/metrics
    database:
      file:
        folder: /perses
        extension: json
    security:
      enable_auth: false
      readonly: true
      cookie:
        secure: true
      encryption_key_file: /identity/encryption-key
    provisioning:
      folders:
      - /resources
    ephemeral_dashboard:
      enable: false
      cleanup_interval: 1h
  volumes:
  - name: resources
    configMap:
      name: twinfra-perses-resources
  - name: identity
    secret:
      secretName: twinfra-perses-key
      defaultMode: 288
  volumeMounts:
  - name: resources
    mountPath: /resources
    readOnly: true
  - name: identity
    mountPath: /identity
    readOnly: true
  livenessProbe:
    httpGet:
      path: /console/metrics/api/v1/health
      port: 8080
  readinessProbe:
    httpGet:
      path: /console/metrics/api/v1/health
      port: 8080
