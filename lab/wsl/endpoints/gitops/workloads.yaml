apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-cpu-app
  namespace: workload-apps
data:
  demo.py: "\"\"\"CPU-only Knative demo; sends a real OTLP/HTTP span for each request.\"\
    \"\"\nfrom http.server import BaseHTTPRequestHandler,ThreadingHTTPServer\nimport\
    \ json\nimport secrets\nimport time\nimport urllib.request\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        start=time.time_ns()\n        body=b'vcloud-knative-cpu-ok\\\
    n'\n        self.send_response(200);self.send_header('Content-Type','text/plain');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)\n\
    \        span={'traceId':secrets.token_hex(16),'spanId':secrets.token_hex(8),'name':'vcloud-demo-request','kind':2,\n\
    \              'startTimeUnixNano':str(start),'endTimeUnixNano':str(time.time_ns()),'status':{'code':1}}\n\
    \        payload={'resourceSpans':[{'resource':{'attributes':[{'key':'service.name','value':{'stringValue':'demo-cpu-app'}}]},\n\
    \                                  'scopeSpans':[{'scope':{'name':'vcloud-local-acceptance'},'spans':[span]}]}]}\n\
    \        request=urllib.request.Request('http://otel-collector.platform-services.svc.cluster.local:4318/v1/traces',\n\
    \                                       data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})\n\
    \        try:\n            with urllib.request.urlopen(request,timeout=2) as response:response.read()\n\
    \            print('OTLP span exported for demo-cpu-app',flush=True)\n       \
    \ except Exception:print('OTLP export failed',flush=True)\n    def log_message(self,*args):pass\n\
    \nThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vcloud-apisix-setup
  namespace: platform-services
data:
  configure-apisix.py: "\"\"\"Restricted init container: compose authenticated APISIX\
    \ config on tmpfs.\"\"\"\nfrom pathlib import Path\nimport re\nimport shutil\n\
    \nkey = Path('/admin/admin-key').read_text().strip()\nif not re.fullmatch('[a-f0-9]{64}',\
    \ key):\n    raise SystemExit('Invalid mounted APISIX admin credential')\nfor\
    \ filename in ('config.yaml', 'apisix.yaml'):\n    # Projected ConfigMaps also\
    \ contain directory symlinks; copy only known files.\n    shutil.copyfile(Path('/config')\
    \ / filename, Path('/conf') / filename)\ntarget = Path('/conf/config.yaml')\n\
    text = target.read_text()\nif text.count('__VCLOUD_ADMIN_KEY__') != 1:\n    raise\
    \ SystemExit('APISIX credential placeholder must occur exactly once')\ntarget.write_text(text.replace('__VCLOUD_ADMIN_KEY__',\
    \ key))\ntarget.chmod(0o600)\n"
