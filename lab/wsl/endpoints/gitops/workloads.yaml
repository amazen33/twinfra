apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: platform-services
  labels: &id001
    app.kubernetes.io/name: openbao
spec:
  selector: *id001
  ports:
  - name: http
    port: 8200
    targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: platform-services
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels: *id001
      annotations:
        vcloud.io/runtime-config-hash: 358f97b7db125e5f57c16c54603c150a03de10eebd8f96bf9291f8d4fc579d16
        vcloud.io/config-hash: e8a8bb242c65829b7734ff7b10e588818abe24b4268afb2a8bbcfec24773dfd0
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openbao
        image: registry.vcloud.example.com/docker.io/openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        volumeMounts: &id002
        - name: auth
          mountPath: /auth
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: pg-ca
          mountPath: /pg-ca
          readOnly: true
        - name: code
          mountPath: /code
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        command:
        - bao
        - server
        - -config=/runtime/openbao.hcl
        ports:
        - name: https
          containerPort: 8200
        startupProbe:
          httpGet:
            path: /v1/sys/init
            port: 8200
            scheme: HTTPS
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/sys/init
            port: 8200
            scheme: HTTPS
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /v1/sys/init
            port: 8200
            scheme: HTTPS
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: auth
        secret:
          secretName: vcloud-wsl-openbao-db
          defaultMode: 288
      - name: tls
        secret:
          secretName: vcloud-wsl-openbao-tls
          defaultMode: 288
      - name: pg-ca
        secret:
          secretName: vcloud-wsl-postgres-ca
          items:
          - key: ca.crt
            path: ca.crt
          defaultMode: 288
      - name: code
        configMap:
          name: vcloud-runtime-config
      - name: runtime
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      initContainers:
      - name: config
        image: registry.vcloud.example.com/docker.io/library/python:3.14.1-slim-trixie@sha256:b823ded4377ebb5ff1af5926702df2284e53cecbc6e3549e93a19d8632a1897e
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /code/runtime-config.py
        - openbao
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts: *id002
  strategy:
    type: Recreate
---
