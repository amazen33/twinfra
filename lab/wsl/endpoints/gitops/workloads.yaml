          value: '1'
        - name: STRICT_SERVICE_LOADING
          value: '1'
        - name: GATEWAY_LISTEN
          value: 0.0.0.0:4566
        - name: LOCALSTACK_HOST
          value: aws.platform.example.com:18080
        - name: DNS_ADDRESS
          value: '0'
        - name: SKIP_SSL_CERT_DOWNLOAD
          value: '1'
        - name: SKIP_INFRA_DOWNLOADS
          value: '1'
        - name: DISABLE_EVENTS
          value: '1'
        - name: DEBUG
          value: '0'
        - name: PERSISTENCE
          value: '0'
        - name: DYNAMODB_IN_MEMORY
          value: '1'
        - name: DYNAMODB_HEAP_SIZE
          value: 256m
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
