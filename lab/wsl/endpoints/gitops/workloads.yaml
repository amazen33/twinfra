apiVersion: v1
kind: ConfigMap
metadata:
  name: vcloud-runtime-config
  namespace: platform-services
data:
  runtime-config.py: "\"\"\"Run inside a restricted init container; private config\
    \ stays on tmpfs.\"\"\"\nimport json\nfrom pathlib import Path\nimport sys\nfrom\
    \ urllib.parse import quote\n\nmode=sys.argv[1]\npassword=Path('/auth/password').read_text()\n\
    host='vcloud-wsl-postgres-rw.platform-services.svc.cluster.local'\nif mode=='openbao':\n\
    \    url=f'postgresql://openbao:{quote(password,safe=\"\")}@{host}:5432/openbao?sslmode=verify-full&sslrootcert=/pg-ca/ca.crt'\n\
    \    text=('ui = true\\ndisable_mlock = true\\napi_addr = \"https://openbao.platform-services.svc.cluster.local:8200\"\
    \\n'\n          'storage \"postgresql\" {\\n connection_url = '+json.dumps(url)+'\\\
    n max_parallel = \"4\"\\n}\\n'\n          'listener \"tcp\" {\\n address = \"\
    0.0.0.0:8200\"\\n cluster_address = \"127.0.0.1:8202\"\\n tls_cert_file = \"/tls/tls.crt\"\
    \\n tls_key_file = \"/tls/tls.key\"\\n}\\n'\n          '# This listener is reachable\
    \ only inside the Pod network namespace.\\n'\n          '# kubectl port-forward\
    \ binds the operator endpoint to host loopback.\\n'\n          'listener \"tcp\"\
    \ {\\n address = \"127.0.0.1:8201\"\\n cluster_address = \"127.0.0.1:8203\"\\\
    n tls_disable = true\\n}\\n')\n    target=Path('/runtime/openbao.hcl')\nelif mode=='keycloak':\n\
    \    # The PostgreSQL JDBC driver verifies the CNPG public CA and service name.\n\
    \    url=f'jdbc:postgresql://{host}:5432/keycloak?sslmode=verify-full&sslrootcert=/pg-ca/ca.crt'\n\
    \    text=('db=postgres\\ndb-username=keycloak\\ndb-password='+password+'\\ndb-url='+url+'\\\
    n'\n          'http-enabled=false\\nhttps-certificate-file=/tls/tls.crt\\nhttps-certificate-key-file=/tls/tls.key\\\
    n'\n          # Keep the browser issuer stable; allow TLS-verified Service backchannels.\n\
    \          'hostname=https://localhost:18443\\nhostname-backchannel-dynamic=true\\\
    nhealth-enabled=true\\nmetrics-enabled=true\\ncache=local\\n')\n    target=Path('/runtime/keycloak.conf')\n\
    else:raise ValueError('Unknown runtime')\ntarget.write_text(text);target.chmod(0o600)\n"
---
