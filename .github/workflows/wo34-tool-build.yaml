name: WO-34 pinned Go tool build
on:
  pull_request:
    branches: [main]
    paths:
      - console/**
      - tools/build_console_image.py
      - tools/platform_oci.py
      - tools/platform_build_images.py
      - tools/refresh_console_*.py
      - tools/ci/compare_console_images.py
      - tools/ci/close_console_exceptions.py
      - tools/ci/refresh_govulncheck_lock.py
      - tools/ci/record_source_evidence.py
      - tools/ci/triage_go_binary.py
      - tools/ci/stage_govulncheck.py
      - tools/ci/toolchain.lock.json
      - tools/ci/triage_go_image.py
      - tools/ci/wo34-triage.json
      - tools/ci/triage_go_source.py
      - tools/ci/refresh_source_analysis_lock.py
      - tools/ci/compare_go_candidates.py
      - .github/workflows/wo34-tool-build.yaml
permissions:
  contents: read
concurrency:
  group: wo34-triage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console-comparison:
    name: WO-34 console image comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.5'
      - name: Install pinned policy libraries
        run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - name: Stage and verify scanner archives and binary hashes
        run: python tools/ci/stage_tools.py --source . --destination .build/scan-tools --only syft grype osv-scanner
      - name: Reproduce and fully compare the WO-34 console images
        run: >-
          python tools/ci/compare_console_images.py
          --base b55c0ea3a7805e80c218dcc13a5bfbea7e259a24
          --tools .build/scan-tools/bin
      - name: Upload complete console comparison and CycloneDX SBOMs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wo34-console-comparison-${{ github.run_attempt }}
          path: |
            .build/wo34-console/comparison.json
            .build/wo34-console/scan/*.json
            .build/wo34-console/scan/*.log
            .build/wo34-console/scan/sboms/
            .build/wo34-console/cache/*.error.log
          if-no-files-found: warn
          retention-days: 14
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce govulncheck from pinned SDK and module data
        run: python3 tools/ci/stage_govulncheck.py --destination .build/go-tools
      - id: matrix
        run: python3 -c 'import json,os; v=json.load(open("tools/ci/wo34-triage.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("value="+json.dumps({"include":v})+"\n")'
      - name: Inspect the pinned Argo CD binary before accepting Go exceptions
        run: >-
          python3 tools/ci/triage_go_binary.py --scanner .build/go-tools/govulncheck
          --image quay.io/argoproj/argocd@sha256:dd3f47d5a5e4da563a7a398506e892481b358a7cec50abdf320c71aa55904bfa
          --path /usr/local/bin/argocd --out .build/go-triage/argocd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: wo34-govulncheck-build
          path: |
            .build/go-tools/govulncheck
            .build/go-tools/govulncheck-build.json
            .build/go-triage/**/*.json
            .build/go-triage/**/*.jsonl
            .build/go-triage/**/*.log
          retention-days: 14
  images:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wo34-govulncheck-build
          path: .build/triage-tools
      - name: Inspect every Go ELF as data (including ineligible candidates)
        env:
          PINNED_IMAGE: ${{ matrix.reference }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          chmod 500 .build/triage-tools/go-tools/govulncheck
          python3 tools/ci/triage_go_image.py --scanner .build/triage-tools/go-tools/govulncheck --image "$PINNED_IMAGE" --out ".build/image-triage/$IMAGE_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: wo34-triage-${{ matrix.name }}
          path: |
            .build/image-triage/**/*.json
            .build/image-triage/**/*.gz
            .build/image-triage/**/*.log
          retention-days: 14
  source:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [argocd, coredns, etcd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: wo34-govulncheck-build
          path: .build/triage-tools
      - name: Analyze tagged source with the published binary toolchain
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          chmod 500 .build/triage-tools/go-tools/govulncheck
          python3 tools/ci/triage_go_source.py --project "$PROJECT" --scanner .build/triage-tools/go-tools/govulncheck --out ".build/source-triage/$PROJECT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: wo34-source-${{ matrix.project }}
          path: |
            .build/source-triage/*/summary.json
            .build/source-triage/*/analysis-*.json.gz
            .build/source-triage/*/analysis-*.log
          retention-days: 14
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.5'
      - run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - run: python tools/ci/stage_tools.py --source . --destination .build/p2-tools --only syft grype osv-scanner
      - name: Compare complete pinned P2 archives against one fresh database
        run: python tools/ci/compare_go_candidates.py --tools .build/p2-tools/bin --out .build/p2-comparison
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: wo34-p2-comparison
          path: |
            .build/p2-comparison/comparison.json
            .build/p2-comparison/scan/*.json
            .build/p2-comparison/scan/sboms/
            .build/p2-comparison/cache/*.error.log
          retention-days: 14
