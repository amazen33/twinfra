name: WO-34 pinned Go tool build
on:
  pull_request:
    branches: [main]
    paths:
      - tools/ci/stage_govulncheck.py
      - tools/ci/toolchain.lock.json
      - .github/workflows/wo34-tool-build.yaml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce govulncheck from pinned SDK and module data
        run: python3 tools/ci/stage_govulncheck.py --destination .build/go-tools --discover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wo34-govulncheck-build
          path: |
            .build/go-tools/govulncheck
            .build/go-tools/govulncheck-build.json
          retention-days: 14
