apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: postgres-resource-scaler, namespace: platform-services}
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [vcloud-postgres]
    verbs: [get, patch]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    resourceNames: [postgres-resources]
    verbs: [get]
