# Source: vcloud-foundation/templates/database.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vcloud-postgres
  namespace: platform-services
spec:
  instances: 1
  imageName: "registry.vcloud.example.com/vcloud/postgresql-pgvector:18.6.0-pgvector0.8.2"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities: {drop: [ALL]}
  bootstrap:
    initdb:
      database: vcloud
      owner: vcloud_app
      postInitApplicationSQL: ["CREATE EXTENSION IF NOT EXISTS vector;"]
  postgresql:
    parameters: {shared_buffers: 256MB, max_connections: "100", huge_pages: "off"}
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "1", memory: 2Gi}
  storage:
    storageClass: vcloud-local
    size: 20Gi
    resizeInUseVolumes: false
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  inheritedMetadata:
    labels: {vcloud.io/component: postgres}
---
# Source: vcloud-foundation/templates/database.yaml
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: {name: postgres-resources, namespace: platform-services}
spec:
  targetRef: {apiVersion: postgresql.cnpg.io/v1, kind: Cluster, name: vcloud-postgres}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        controlledResources: [cpu, memory]
        minAllowed: {cpu: "1", memory: 2Gi}
        maxAllowed: {cpu: "2", memory: 4Gi}
