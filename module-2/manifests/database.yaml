# Source: vcloud-foundation/templates/database.yaml
apiVersion: batch/v1
kind: CronJob
metadata: {name: postgres-resource-scaler, namespace: platform-services}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 45
      template:
        metadata: {labels: {vcloud.io/component: postgres-resource-scaler}}
        spec:
          serviceAccountName: postgres-resource-scaler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: scaler
              image: "registry.vcloud.example.com/docker.io/library/python:3.14.1-slim-trixie@sha256:b823ded4377ebb5ff1af5926702df2284e53cecbc6e3549e93a19d8632a1897e"
              imagePullPolicy: IfNotPresent
              command: [python, /app/scaler.py]
              env:
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: CLUSTER_NAME, value: "vcloud-postgres"}
                - {name: NAMESPACE, value: platform-services}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 100m, memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts: [{name: code, mountPath: /app, readOnly: true}]
          volumes:
            - name: code
              configMap: {name: postgres-resource-scaler, defaultMode: 292}
