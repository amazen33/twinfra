apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix
  namespace: platform-services
data:
  config.yaml: |-
    #
    # Licensed to the Apache Software Foundation (ASF) under one or more
    # contributor license agreements.  See the NOTICE file distributed with
    # this work for additional information regarding copyright ownership.
    # The ASF licenses this file to You under the Apache License, Version 2.0
    # (the "License"); you may not use this file except in compliance with
    # the License.  You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    #
    apisix:
      enable_admin: true
      enable_ipv6: false
      enable_server_tokens: false
      ssl:
        enable: true
        listen:
        - port: 9443
        ssl_cert: /etc/vcloud-gateway-tls/tls.crt
        ssl_cert_key: /etc/vcloud-gateway-tls/tls.key
        ssl_protocols: TLSv1.2 TLSv1.3
        ssl_trusted_certificate: /etc/vcloud-ca/ca.crt
    deployment:
      admin:
        admin_api_mtls:
          admin_ssl_ca_cert: /etc/vcloud-ca/ca.crt
          admin_ssl_cert: /etc/vcloud-admin-tls/tls.crt
          admin_ssl_cert_key: /etc/vcloud-admin-tls/tls.key
        admin_key:
        - key: ${{APISIX_ADMIN_KEY}}
          name: controller
          role: admin
        admin_key_required: true
        admin_listen:
          ip: 0.0.0.0
          port: 9180
        allow_admin:
        - 10.42.0.0/16
        enable_admin_cors: false
        enable_admin_ui: false
        https_admin: true
      role: traditional
      role_traditional:
        config_provider: yaml
    nginx_config:
      envs:
      - APISIX_ADMIN_KEY
      - APISIX_OIDC_CLIENT_SECRET
      http:
        client_max_body_size: 1m
      http_configuration_snippet: |
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/vcloud-ca/ca.crt;
---
