apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: platform-services
  labels:
    helm.sh/chart: apisix-2.18.0
    
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix
    app.kubernetes.io/version: "3.19.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      
      app.kubernetes.io/name: apisix
      app.kubernetes.io/instance: apisix
  template:
    metadata:
      annotations:
        checksum/config: b4a268912721f495ebe66a4793f9b6e40172ccf55a8da89c6993387f5209840d
      labels:
        
        app.kubernetes.io/name: apisix
        app.kubernetes.io/instance: apisix
    spec:
      serviceAccountName: apisix-runtime
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: apisix
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          image: "registry.vcloud.example.com/vcloud/apisix:3.19.0-vcloud.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: oidc-client-secret
                  name: apisix-runtime-secrets
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-runtime-secrets
                  key: admin
            - name: APISIX_VIEWER_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-runtime-secrets
                  key: viewer
            - name: APISIX_ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etcd-apisix
                  key: etcd-root-password

          ports:
            - name: http
              containerPort: 9080
              protocol: TCP     
            - name: tls
              containerPort: 9443
              protocol: TCP
            - name: admin
              containerPort: 9180
              protocol: TCP
            - name: status
              containerPort: 7085
              protocol: TCP
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            httpGet:
              path: /status/ready
              port: 7085
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - sleep 30
          volumeMounts:
            - mountPath: /usr/local/apisix/conf/config.yaml
              name: apisix-config
              subPath: config.yaml
            - mountPath: /etc/vcloud-ca
              name: trusted-ca
              readOnly: true
            - mountPath: /etc/vcloud-admin-tls
              name: admin-tls
              readOnly: true
            - mountPath: /etc/vcloud-gateway-tls
              name: gateway-tls
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
      hostNetwork: false
      initContainers:
      volumes:
        - configMap:
            name: apisix
          name: apisix-config
        - name: trusted-ca
          secret:
            defaultMode: 292
            secretName: vcloud-runtime-ca
        - name: admin-tls
          secret:
            defaultMode: 292
            secretName: apisix-admin-tls
        - name: gateway-tls
          secret:
            defaultMode: 292
            secretName: apisix-gateway-tls
