# Source: vcloud-foundation/templates/function.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: secure-function
  namespace: workload-apps
  labels: {networking.knative.dev/visibility: cluster-local}
spec:
  template:
    metadata:
      labels: {vcloud.io/function: secure-function}
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
        autoscaling.knative.dev/target: "10"
        kubernetes.io/egress-bandwidth: 100M
    spec:
      serviceAccountName: secure-function
      automountServiceAccountToken: false
      containerConcurrency: 10
      timeoutSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: function
          image: "registry.vcloud.example.com/docker.io/library/python:3.14.1-slim-trixie@sha256:b823ded4377ebb5ff1af5926702df2284e53cecbc6e3549e93a19d8632a1897e"
          imagePullPolicy: IfNotPresent
          command: [python, /app/function.py]
          ports: [{name: http1, containerPort: 8080}]
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: code, mountPath: /app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: function-data, readOnly: true}
        - name: code
          configMap: {name: function-code, defaultMode: 292}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
# Source: vcloud-foundation/templates/gateway.yaml
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata: {name: secure-function, namespace: platform-services}
spec:
  ingressClassName: apisix
  http:
    - name: function
      match:
        hosts: [api.vcloud.example.com]
        paths: [/function]
        methods: [GET]
        exprs: [{subject: {scope: Variable, name: scheme}, op: Equal, value: https}]
      backends:
        - serviceName: kourier-internal
          servicePort: 443
          resolveGranularity: service
      plugins:
        - name: proxy-rewrite
          enable: true
          config: {uri: /, host: secure-function.workload-apps.svc.cluster.local}
        - name: openid-connect
          enable: true
          config:
            client_id: vcloud-function
            client_secret: $ENV://APISIX_OIDC_CLIENT_SECRET
            discovery: https://auth.vcloud.example.com/realms/vcloud/.well-known/openid-configuration
            bearer_only: true
            use_jwks: true
            ssl_verify: true
            unauth_action: deny
            accept_none_alg: false
            accept_unsupported_alg: false
            claim_validator:
              issuer: {valid_issuers: [https://auth.vcloud.example.com/realms/vcloud]}
              audience: {required: true, match_with_client_id: true}
