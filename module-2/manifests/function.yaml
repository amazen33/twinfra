# Source: vcloud-foundation/templates/gateway.yaml
# The route and Kourier backend are in the SAME namespace; CRD forbids cross-namespace backends.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata: {name: kourier-internal, namespace: platform-services}
spec:
  ingressClassName: apisix
  scheme: https
  passHost: rewrite
  upstreamHost: secure-function.workload-apps.svc.cluster.local
  retries: 0
  timeout: {connect: 5s, send: 65s, read: 65s}
  tlsSecret: {name: knative-upstream-tls, namespace: platform-services}
